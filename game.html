<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTEROID DODGE — day one vs day seven</title>
<style>
  body { margin: 0; background: #060612; color: #fff;
         font-family: system-ui, sans-serif; text-align: center; }
  canvas { display: block; margin: 12px auto; background: #060612;
           border: 2px solid #263; max-width: 96vw; }
  h1 { margin: 14px 0 0; font-size: 22px; letter-spacing: 2px; }
  h1 b { color: #ff0080; }
  p { color: #aaa; margin: 6px 0 0; }
  #hud { font-family: monospace; font-size: 18px; margin-top: 8px; }
  #hud span { color: #7dff9e; }
</style>
</head>
<body>
<h1>ASTEROID <b>DODGE</b></h1>
<p>Day 1: just dodge. Day 7: lasers, explosions, power-ups. Same map, same start.</p>
<div id="hud">SCORE <span id="score">00000</span> &nbsp; COMBO <span id="combo">x1</span> &nbsp; <span id="shield"></span></div>
<canvas id="game" width="540" height="760"></canvas>
<p>Move: &larr; &rarr; or A / D &nbsp;·&nbsp; Fire: Space &nbsp;·&nbsp; Restart: R</p>
<script>
"use strict";
// ASTEROID DODGE - a tiny game an AI agent built, then updated daily
// for a week. Day-one build had no lasers and no score; this is the
// day-seven build: same map, same start, way more game.
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

let ship = { x: W / 2, y: H - 120, vx: 0 };
let rocks = [], bullets = [], parts = [], powerups = [];
let score = 0, combo = 1, shield = false, over = false, t = 0;
let keys = {};

function spawnRock(first) {
  const r = 18 + Math.random() * 26;
  rocks.push({
    x: 30 + Math.random() * (W - 60),
    y: first ? -r - Math.random() * 400 : -r,
    r, vy: 1.6 + Math.random() * 2.2 + t / 9000,
    rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.02,
    seed: Math.random()
  });
}
for (let i = 0; i < 3; i++) spawnRock(true);

function explode(x, y, r) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * 6.28, s = 1 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                 life: 22 + Math.random() * 14, r: 2 + Math.random() * 3 });
  }
  score += 10 * combo;
  combo = Math.min(9, combo + 1);
}

function step() {
  if (over) return;
  t++;
  if (keys.ArrowLeft || keys.a) ship.vx -= 0.9;
  if (keys.ArrowRight || keys.d) ship.vx += 0.9;
  ship.vx *= 0.86;
  ship.x = Math.max(24, Math.min(W - 24, ship.x + ship.vx));

  if (t % 16 === 0 && keys[" "]) {
    bullets.push({ x: ship.x, y: ship.y - 40 });
  }
  if (t % 55 === 0) spawnRock(false);
  if (t % 600 === 0) powerups.push({ x: 40 + Math.random() * (W - 80), y: -20 });

  for (const b of bullets) b.y -= 14;
  bullets = bullets.filter(b => b.y > -20);
  for (const r of rocks) { r.y += r.vy; r.rot += r.vr; }
  rocks = rocks.filter(r => r.y < H + 60);
  for (const p of powerups) p.y += 2;
  powerups = powerups.filter(p => p.y < H + 20);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.life--; }
  parts = parts.filter(p => p.life > 0);

  // bullets vs rocks
  for (const b of bullets) {
    for (const r of rocks) {
      const dx = b.x - r.x, dy = b.y - r.y;
      if (dx * dx + dy * dy < (r.r + 6) * (r.r + 6)) {
        explode(r.x, r.y, r.r);
        r.y = H + 99; b.y = -99;
      }
    }
  }
  // ship vs rocks
  for (const r of rocks) {
    const dx = ship.x - r.x, dy = ship.y - r.y;
    if (dx * dx + dy * dy < (r.r + 18) * (r.r + 18)) {
      if (shield) { shield = false; explode(r.x, r.y, r.r); r.y = H + 99; }
      else { over = true; }
    }
  }
  // ship vs power-ups
  for (const p of powerups) {
    if (Math.abs(p.x - ship.x) < 34 && Math.abs(p.y - ship.y) < 40) {
      shield = true; p.y = H + 99;
      document.getElementById("shield").textContent = "SHIELD UP";
    }
  }
  if (t % 30 === 0) score += 1; // survival points
  document.getElementById("score").textContent = String(score).padStart(5, "0");
  document.getElementById("combo").textContent = "x" + combo;
}

function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.rot);
  ctx.beginPath();
  for (let i = 0; i < 9; i++) {
    const a = i * (Math.PI * 2 / 9);
    const rr = r.r * (0.8 + 0.14 * Math.sin(r.seed * 40 + i * 2.7));
    i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr)
      : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = "#96949b";
  ctx.strokeStyle = "#5a5860";
  ctx.lineWidth = 3;
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = "#060612";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 60; i++) {
    const x = (i * 137) % W, y = (i * 211 + t * 0.6) % H;
    ctx.globalAlpha = 0.3 + (i % 3) * 0.25;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
  for (const p of powerups) {
    ctx.fillStyle = "#3cdc78";
    ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px monospace";
    ctx.fillText("+", p.x - 7, p.y + 7);
  }
  for (const r of rocks) drawRock(r);
  ctx.fillStyle = "#ffe878";
  for (const b of bullets) ctx.fillRect(b.x - 3, b.y - 18, 6, 22);
  ctx.fillStyle = "#ff783c";
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // ship
  ctx.fillStyle = "#ebf5ff";
  ctx.beginPath();
  ctx.moveTo(ship.x, ship.y - 30);
  ctx.lineTo(ship.x - 18, ship.y + 22);
  ctx.lineTo(ship.x, ship.y + 10);
  ctx.lineTo(ship.x + 18, ship.y + 22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#50beff";
  ctx.beginPath(); ctx.arc(ship.x, ship.y - 8, 6, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#ffaa28";
  ctx.beginPath();
  ctx.moveTo(ship.x - 7, ship.y + 22);
  ctx.lineTo(ship.x + 7, ship.y + 22);
  ctx.lineTo(ship.x, ship.y + 38 + Math.random() * 8);
  ctx.closePath(); ctx.fill();
  if (shield) {
    ctx.strokeStyle = "#7dff9e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ship.x, ship.y, 42, 0, 6.29); ctx.stroke();
  }
  if (over) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 44px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
    ctx.font = "20px system-ui";
    ctx.fillText("Score " + score + " — press R to fly again", W / 2, H / 2 + 30);
    ctx.textAlign = "left";
  }
}

addEventListener("keydown", e => {
  keys[e.key === " " ? " " : e.key] = true;
  if (e.key === " ") e.preventDefault();
  if ((e.key === "r" || e.key === "R") && over) location.reload();
});
addEventListener("keyup", e => { keys[e.key === " " ? " " : e.key] = false; });

setInterval(() => { step(); draw(); }, 1000 / 60);
</script>
</body>
</html>
